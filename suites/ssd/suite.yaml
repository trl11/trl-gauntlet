# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: ssd
title: SSD Endurance
category: hardware
description: >
  Probe one or more SSDs on the unit under test. Each tick measures write and
  read bandwidth with dd, verifies a written block with a SHA-256 compare, and
  reads SMART error counters.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Tick period
    unit: s
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
