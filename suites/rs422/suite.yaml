# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: rs422
title: RS422 Link
category: hardware
description: >
  Exercise an RS422 serial link to the unit under test. The lab side sends ENQ
  probes and reads the counter replies, recording gaps and reordering against
  the expected sequence.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: rate_hz
    flag: --rate-hz
    type: number
    label: Probe rate
    unit: Hz
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
