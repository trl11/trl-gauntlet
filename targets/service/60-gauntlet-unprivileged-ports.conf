# Let the rig's landing page bind port 80 without root.
#
# Install on a bench that serves the landing page. `setup-host.sh` copies this
# into /etc/sysctl.d/ and applies it, which is the same one root step the udev
# rules already need.
#
#     sudo cp targets/service/60-gauntlet-unprivileged-ports.conf /etc/sysctl.d/
#     sudo sysctl --system
#
# Everything on a rig runs as the operator, because the udev rules grant the
# instruments to that account's groups and a deploy must not need a password.
# Ports below 1024 are the one thing an ordinary user cannot have, so the
# landing page would need root, a capability on the interpreter, or a redirect
# — and a user systemd unit can be given none of them.
#
# What this trades: every port from 80 up becomes bindable by any local user,
# rather than only by root. On a single-operator bench on a lab network that is
# no one new, since that account already has the instruments and the service.
# On a shared or exposed host it is worth thinking about first.
#
# Verify: `sysctl net.ipv4.ip_unprivileged_port_start` reports 80.
net.ipv4.ip_unprivileged_port_start = 80
