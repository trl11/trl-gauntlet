# How much memory usbfs will pin for transfers in flight.
#
# A USB3 Vision camera's frame arrives in one such buffer, and the kernel's
# 16 MB default is smaller than a single frame off a 20 megapixel sensor: the
# transport layer cannot queue one whole, so the camera opens, reports its
# format, and then every grab comes back incomplete.
#
# systemd-tmpfiles rather than sysctl, because this is a module parameter
# under /sys/module, which sysctl does not reach. usbcore is built into the
# kernel on Ubuntu, so a modprobe.d option would not be read either.
w /sys/module/usbcore/parameters/usbfs_memory_mb - - - - 1000
