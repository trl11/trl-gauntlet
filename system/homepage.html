<!doctype html>
<!--
  The rig's landing page, served on port 80 by serve-homepage.py.

  Self-contained on purpose: a bench has no reliable route to the internet, so
  there is no font, stylesheet or script here that is not in this file.

  It names no host. Every link is built from location.hostname, so the page
  works through whatever address the browser arrived on and a rig that is
  renamed or readdressed needs no edit. The stats come from Gauntlet through
  the same origin, and the page still renders when Gauntlet is down.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gauntlet rig</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --edge: #262d38;
        --ink: #e6edf3;
        --dim: #8b949e;
        --accent: #4a9eff;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          Consolas,
          monospace;
        margin: 0;
        padding: 32px 24px 64px;
      }
      main {
        margin: 0 auto;
        max-width: 1100px;
      }
      header {
        align-items: baseline;
        border-bottom: 1px solid var(--edge);
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 28px;
        padding-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0;
      }
      h2 {
        color: var(--dim);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        margin: 0 0 12px;
        text-transform: uppercase;
      }
      .sub {
        color: var(--dim);
      }
      section {
        margin-bottom: 32px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--edge);
        padding: 14px 16px;
      }
      .card .label {
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .card .value {
        font-size: 26px;
        font-weight: 600;
        margin: 6px 0 2px;
      }
      .card .detail {
        color: var(--dim);
        font-size: 12px;
      }
      .bar {
        background: var(--edge);
        height: 4px;
        margin-top: 10px;
        overflow: hidden;
      }
      .bar span {
        background: var(--accent);
        display: block;
        height: 100%;
        transition: width 0.4s ease;
      }
      .bar.ok span {
        background: var(--ok);
      }
      .bar.warn span {
        background: var(--warn);
      }
      .bar.bad span {
        background: var(--bad);
      }
      table {
        border-collapse: collapse;
        font-size: 13px;
        width: 100%;
      }
      th {
        color: var(--dim);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-align: right;
        text-transform: uppercase;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      td,
      th {
        border-bottom: 1px solid var(--edge);
        padding: 7px 10px;
        text-align: right;
      }
      tbody tr:hover {
        background: var(--panel);
      }
      .links {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
      a.tile {
        background: var(--panel);
        border: 1px solid var(--edge);
        color: var(--ink);
        display: block;
        padding: 16px;
        text-decoration: none;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      a.tile:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      a.tile .name {
        font-size: 15px;
        font-weight: 600;
      }
      a.tile .what {
        color: var(--dim);
        font-size: 12px;
        margin-top: 4px;
      }
      .pill {
        border: 1px solid var(--edge);
        color: var(--dim);
        font-size: 11px;
        padding: 2px 8px;
      }
      .pill.up {
        border-color: var(--ok);
        color: var(--ok);
      }
      .pill.down {
        border-color: var(--bad);
        color: var(--bad);
      }
      .empty {
        color: var(--dim);
        padding: 14px 0;
      }
      code {
        background: var(--panel);
        border: 1px solid var(--edge);
        padding: 1px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="host">rig</h1>
          <div class="sub" id="host-detail">reading the bench&hellip;</div>
        </div>
        <div class="sub" id="uptime"></div>
      </header>

      <section>
        <h2>Bench</h2>
        <div class="grid" id="stats">
          <div class="card">
            <div class="empty">waiting for the first sample&hellip;</div>
          </div>
        </div>
      </section>

      <section>
        <h2>Network</h2>
        <div id="network"><div class="empty">waiting&hellip;</div></div>
      </section>

      <section>
        <h2>Where to go</h2>
        <div class="links" id="links"></div>
      </section>

      <section>
        <h2>Datasheets</h2>
        <div id="datasheets"><div class="empty">reading&hellip;</div></div>
      </section>
    </main>

    <script>
      // Gauntlet is on 7100 wherever this page came from, so the link follows
      // the browser rather than naming a host this file would have to be
      // edited to change.
      const GAUNTLET = `${location.protocol}//${location.hostname}:7100`;
      const REPO = "https://github.com/gabephantrl11/trl-gauntlet";
      const POLL_MS = 3000;

      const bytes = (n) => {
        if (n === null || n === undefined) return "—";
        const units = ["B", "KB", "MB", "GB", "TB"];
        let value = n;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit += 1;
        }
        return `${value < 10 && unit > 0 ? value.toFixed(1) : Math.round(value)} ${units[unit]}`;
      };

      const duration = (seconds) => {
        if (seconds === null || seconds === undefined) return "—";
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        if (days) return `up ${days}d ${hours}h`;
        if (hours) return `up ${hours}h ${minutes}m`;
        return `up ${minutes}m`;
      };

      // Percentages colour the same way everywhere: comfortable, watch it,
      // running out.
      const band = (percent) =>
        percent >= 90 ? "bad" : percent >= 75 ? "warn" : "ok";

      const el = (id) => document.getElementById(id);

      const card = (label, value, detail, percent) => {
        const width =
          percent === null || percent === undefined
            ? null
            : Math.max(0, Math.min(100, percent));
        return `
          <div class="card">
            <div class="label">${label}</div>
            <div class="value">${value}</div>
            <div class="detail">${detail}</div>
            ${width === null ? "" : `<div class="bar ${band(width)}"><span style="width:${width}%"></span></div>`}
          </div>`;
      };

      const renderStats = (data) => {
        const cards = [];

        // cpu_percent is null until a second sample, by design, so the first
        // paint shows the load average instead of a zero that is not true.
        const load = data.load_avg ? data.load_avg[0].toFixed(2) : "—";
        cards.push(
          data.cpu_percent === null || data.cpu_percent === undefined
            ? card("CPU", "—", `load ${load} · sampling`, null)
            : card(
                "CPU",
                `${data.cpu_percent.toFixed(0)}%`,
                `load ${load}`,
                data.cpu_percent,
              ),
        );

        const memory = data.memory || {};
        cards.push(
          card(
            "Memory",
            memory.percent === null || memory.percent === undefined
              ? "—"
              : `${memory.percent.toFixed(0)}%`,
            `${bytes(memory.used)} of ${bytes(memory.total)}`,
            memory.percent,
          ),
        );

        const disk = data.disk || (data.disks || [])[0];
        cards.push(
          disk
            ? card(
                "Disk",
                `${disk.percent.toFixed(0)}%`,
                `${bytes(disk.free)} free on ${disk.mount}`,
                disk.percent,
              )
            : card("Disk", "—", "no filesystem reported", null),
        );

        const hottest = (data.temperatures || []).reduce(
          (worst, reading) =>
            worst === null || reading.celsius > worst.celsius ? reading : worst,
          null,
        );
        cards.push(
          hottest
            ? card(
                "Temperature",
                `${hottest.celsius.toFixed(0)}°C`,
                hottest.label,
                null,
              )
            : card("Temperature", "—", "no thermal zone", null),
        );

        el("stats").innerHTML = cards.join("");
        el("uptime").textContent =
          `${duration(data.uptime_s)}${data.process_count ? ` · ${data.process_count} processes` : ""}`;
      };

      const renderNetwork = (interfaces) => {
        if (!interfaces || !interfaces.length) {
          // Undefined rather than empty means a Gauntlet older than the field.
          el("network").innerHTML =
            `<div class="empty">${interfaces ? "no interfaces reported" : "this Gauntlet does not report interfaces"}</div>`;
          return;
        }
        const rows = interfaces
          .map(
            (nic) => `
              <tr>
                <td>${nic.name} <span class="pill ${nic.state === "up" ? "up" : "down"}">${nic.state}</span></td>
                <td>${nic.address || "—"}</td>
                <td>${bytes(nic.rx_bytes)}</td>
                <td>${bytes(nic.tx_bytes)}</td>
                <td>${nic.rx_errors + nic.tx_errors}</td>
                <td>${nic.rx_dropped + nic.tx_dropped}</td>
              </tr>`,
          )
          .join("");
        el("network").innerHTML = `
          <table>
            <thead>
              <tr><th>Interface</th><th>Address</th><th>Received</th><th>Sent</th><th>Errors</th><th>Dropped</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      };

      const renderLinks = () => {
        const tiles = [
          [GAUNTLET, "Gauntlet", "Run a suite, watch a run, read the history"],
          [
            `${GAUNTLET}/docs`,
            "API reference",
            "Every endpoint, generated from the application",
          ],
          [REPO, "Repository", "The source this bench is built from"],
        ];
        el("links").innerHTML = tiles
          .map(
            ([href, name, what]) =>
              `<a class="tile" href="${href}"><div class="name">${name}</div><div class="what">${what}</div></a>`,
          )
          .join("");
      };

      const renderDatasheets = (sheets) => {
        if (!sheets.length) {
          el("datasheets").innerHTML = `
            <div class="empty">
              Nothing here yet. Copy one over with
              <code>scp datasheet.pdf ${location.hostname}:~/.config/gauntlet/datasheets/</code>
            </div>`;
          return;
        }
        const rows = sheets
          .map(
            (sheet) => `
              <tr>
                <td><a href="/datasheets/${encodeURIComponent(sheet.name)}">${sheet.name}</a></td>
                <td>${bytes(sheet.bytes)}</td>
                <td>${new Date(sheet.modified * 1000).toISOString().slice(0, 10)}</td>
              </tr>`,
          )
          .join("");
        el("datasheets").innerHTML = `
          <table>
            <thead><tr><th>File</th><th>Size</th><th>Added</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      };

      const failed = (why) => {
        el("stats").innerHTML =
          `<div class="card"><div class="empty">${why}</div></div>`;
        el("network").innerHTML = `<div class="empty">${why}</div>`;
      };

      const load = async () => {
        try {
          const response = await fetch("/api/system/data");
          if (!response.ok)
            throw new Error(`Gauntlet answered ${response.status}`);
          const data = await response.json();
          renderStats(data);
          renderNetwork(data.interfaces);
        } catch (error) {
          failed(`Gauntlet is not answering — ${error.message}`);
        }
      };

      const start = async () => {
        renderLinks();

        try {
          const info = await (await fetch("/api/system/info")).json();
          el("host").textContent = info.hostname || location.hostname;
          el("host-detail").textContent =
            `Gauntlet ${info.gauntlet} · ${info.cpu_model || info.arch} · ${info.os}`;
        } catch {
          el("host").textContent = location.hostname;
          el("host-detail").textContent = "Gauntlet is not answering";
        }

        try {
          const sheets = await (await fetch("/datasheets")).json();
          renderDatasheets(sheets.datasheets || []);
        } catch {
          el("datasheets").innerHTML =
            `<div class="empty">could not read the datasheets</div>`;
        }

        await load();
        setInterval(load, POLL_MS);
      };

      start();
    </script>
  </body>
</html>
