description: >
  Tight limits for a host that is expected to be idle and cool. Exercises the
  failure path on anything under real load.
duration_s: 60.0
sample_period_s: 0.5
max_cpu_percent: 25.0
min_available_memory_percent: 40.0
min_free_disk_percent: 25.0
max_load_per_core: 0.5
max_temperature_c: 60.0
max_new_interface_errors: 0
stop_on_failure: false
