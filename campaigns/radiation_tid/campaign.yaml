# yaml-language-server: $schema=http://127.0.0.1:7100/api/campaigns/schema
apiVersion: 1
key: radiation_tid
title: Radiation TID
description: 'Total ionising dose characterisation of the flight component set, one suite
  per component. The LAN7430, the SSD and both ends of the GMSL link measure; the three
  remaining suites are placeholders that run and pass without hardware, so the campaign
  has a green baseline to fill in.'
suites: ./suites
profile: standard.yaml
members:
- suite: tid_lan7430
  component: LAN7430-I/Y9X
  test_vehicle: EVB-LAN7430
  host: Raspberry Pi
  fixture: 1-1
  notes: Can use a JM201, or wait for the EVB-LAN7430 to arrive.
- suite: tid_ads7138
  component: ADS7138QRTERQ1
  test_vehicle: PRE-10161
  host: Raspberry Pi
  fixture: 1-1
  notes: Waiting on PRE-10161.
- suite: tid_tmp100
  component: TMP100AQDBVRQ1
  test_vehicle: PRE-10161
  host: Raspberry Pi
  fixture: 1-1
  notes: Waiting on PRE-10161. A thermocouple is to be added to the BOM.
- suite: tid_max96793
  component: MAX96793GTJ/VY+
  test_vehicle: LI-IMX728-GMSL3-070H
  host: JM201
  fixture: 2-1
  notes: Waiting on LI-IMX728-GMSL3-070H.
- suite: tid_max96792
  component: MAX96792AGTM/VY+
  test_vehicle: LI-GMSL3-USB3.2
  host: JM201
  fixture: 3-1
  notes: Waiting on LI-IMX728-GMSL3-070H.
- suite: tid_pic18f26k83
  component: PIC18F26K83-E/SS
  test_vehicle: TBD
  host: Jetson or Linux laptop
  fixture: 9-1
  notes: The part runs PMU3, whose firmware carries a telemetry stream written for
    a radiation campaign, so the suite reads the part's own detectors, reset history
    and time base over the debug UART alone. That half is implemented. The supply,
    the I2C bridge and the logic analyzer are not wired yet and the six analog and
    timing measurements that need them are not taken. Test vehicle is still open -
    the whole board must not be in the beam, so it wants a carrier holding the
    SSOP-28 part alone. See the suite's README.md.
- suite: tid_alvium
  component: ALVIUM 1800 U-2040c
  test_vehicle: Alvium 1800 U-2040c
  host: Gauntlet lab host, over USB3
  fixture: TBD
  notes: The camera is the whole test vehicle - it hangs off the lab host on a USB
    cable with nothing between. Fixture is not yet chosen; the housing is the
    camera's heatsink and has to be mounted to something with mass, or it shuts its
    image path down within about twenty minutes and the fault reads as dose. Run the
    hardware campaign's alvium_camera against it before the first exposure.
- suite: tid_ssd
  component: TBD
  test_vehicle: TBD
  host: Raspberry Pi
  fixture: TBD
  notes: Forked from the hardware campaign's ssd suite, which stays there as the quick
    bench check. Component, test vehicle and fixture are not yet chosen; run bench.yaml
    against whichever drive is picked before the first exposure.
