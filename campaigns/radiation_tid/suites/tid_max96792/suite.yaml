# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_max96792
title: MAX96792 GMSL3 Deserializer
category: radiation
description: >
  Total ionising dose characterisation of the MAX96792AGTM/VY+ on LI-GMSL3-USB3.2.
  Runs a continuous capture loop, reporting image reception status, dropped
  frame count, link error counts read from the chip itself, and the data rate
  in Mbps. Both ends of the link are recorded; the deserializer is the part under
  the beam.

setup: |
  The deserializer sits in the LI-GMSL3-USB3.2 adapter, and the adapter is the
  only thing in the beam. An LI-IMX728-GMSL3-070H camera head outside the beam
  drives the link into it: the head carries an IMX728 image sensor, whose
  video its MAX96793 serializer puts on the GMSL link. That serializer is the
  known-good reference. The host the adapter connects to is outside the beam
  as well. One capture crosses both chips, so a fault at one end alone says
  which end moved.

  The sensor is outside the beam with the serializer, so what a snapshot shows
  is the link rather than a sensor that has been irradiated too.

  The adapter presents the head to the host as an ordinary UVC camera. It also
  tunnels I2C to both chips over a vendor extension unit on the same USB
  connection, so nothing is wired to either board to read the link. Gauntlet
  owns the device, and the suite drives it through the camera capability over
  HTTP. The suite only ever reads the two chips. A write can drop the link,
  and a link dropped under the beam looks exactly like a radiation effect.

      +----------------+   GMSL   +-----------------+   USB   +------------+
      | LI-IMX728 head |--------->| LI-GMSL3-USB3.2 |-------->|    Host    |
      |                |          |                 |         |            |
      | IMX728 sensor  |          |    MAX96792     |         | UVC video, |
      |       |        |          |  deserializer   |         | and I2C on |
      |       v        |          |                 |         |  the same  |
      |    MAX96793    |          |                 |         |    USB     |
      |   serializer   |          |                 |         +------------+
      +----------------+          +-----------------+
       outside the beam             under the beam            outside the beam

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, frames, junit, manifest, metrics, summary, verdict]

# Charted on the Metrics tab and columned on the Iterations tab before the
# operator picks their own. The running error total is the dose response, and
# its slope is what changes first; the per-sample count is sawtoothed by the
# sample period, because the chip's counters clear when they are read. The two
# video series say whether the link is still carrying what it carried.
#
# locked, unlocks and link_error are deliberately absent. They hold a constant
# until the part is gone, so they make poor charts and belong in the verdict.
default_metrics: [deserializer.decode_errors_a, deserializer.errors_total, video.dropped, video.mbps]
requires: [camera]

supports:
  target: false
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    # Zero is a duration: it gives the loop no end of its own and the suite
    # samples until the operator stops the run, which is what `continuous.yaml`
    # ships. A floor of 1 would reject the value that profile seeds the form
    # with.
    minimum: 0
    help: How long to watch the link.
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    # The floor a mock run may reach, because one form serves both drivers and
    # a bound that refused what `smoke.yaml` ships would reject the value the
    # form was seeded with. A real run is held to MIN_SAMPLE_PERIOD_S by the
    # profile itself, which refuses in words naming the number.
    minimum: 0.25
    help: >
      Seconds between samples. Reading both chips and converting a snapshot
      costs about a second, so a real run is refused below 2s rather than
      quietly delivering a slower rate than it asked for. A mock run has no
      link to read and may go quicker.
  - name: max_width
    flag: --max-width
    type: integer
    label: Snapshot width
    unit: px
    minimum: 16
    maximum: 3840
    help: Width to scale each kept frame to.
  - name: part_address
    flag: --part-address
    type: string
    label: Part I2C address
    help: >
      The chip under the beam, as a hexadecimal byte. Both ends are recorded
      either way; this is the one the verdict is about.
  - name: max_errors_per_sample
    flag: --max-errors-per-sample
    type: integer
    label: Max errors per sample
    minimum: 0
    help: >
      Link errors in one sample before that sample fails. The chip's counters
      clear when read, so this is a rate rather than a total.
  - name: snapshot_every
    flag: --snapshot-every
    type: integer
    label: Keep every Nth frame
    minimum: 0
    help: Keep one snapshot every N samples, or 0 to keep none.
