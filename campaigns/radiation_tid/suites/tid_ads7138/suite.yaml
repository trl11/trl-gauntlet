# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_ads7138
title: ADS7138 12-Bit ADC
category: radiation
description: >
  Total ionising dose characterisation of an ADS7138. Each sample
  converts the two analog inputs and holds them to a window, checks the part
  reads its two digital inputs as wired (a 1 and a 0), drives its four
  outputs (a 0, a 1, a toggled pin and a slow pulse) and checks the logic
  analyzer saw them, and checks the configuration and SYSTEM_STATUS still read as written.

setup: |
  The part reaches the host over a CP2112 USB-to-I2C bridge, through the i2c
  capability, and four of its outputs run to the logic analyzer.

      pin 15  AIN0   analog input      converted, held to a window
      pin 16  AIN1   analog input      converted, held to a window
      pin 1   GPIO2  input, tied to 1  the part must read 1
      pin 4   GPIO5  input, tied to 0  the part must read 0
      pin 2   GPIO3  output, toggled   analyzer probe 2, flips every sample
      pin 3   GPIO4  output, 0         analyzer probe 3
      pin 5   GPIO6  output, 1         analyzer probe 5
      pin 6   GPIO7  output, a pulse   analyzer probe 6, flips every sample

      +--------------+   USB   +--------------+    I2C    +----------------+
      |     Host     |-------->|    CP2112    |---------->|    ADS7138     |
      +--------------+         +--------------+  SDA SCL  +----------------+
             ^                                                    |
             |   USB           +--------------+   pins 2,3,5,6    |
             +-----------------|   analyzer   |<------------------+
                               +--------------+

  The probe each output is on and the window each analog input is held to are
  set in the profile.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: [i2c, logic]

supports:
  target: false
  unit_serial: true

default_metrics: [ads7138.ain0_v, ads7138.ain1_v, ads7138.faults]

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    minimum: 0
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.1
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock drives a register model of the part and contacts no instrument.
