# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_ads7138
title: ADS7138 12-Bit ADC
category: radiation
description: >
  Total ionising dose characterisation of the ADS7138QRTERQ1 on PRE-10161.
  Read the data from 2 ADCs across 4 inputs, and set 2 outputs. Placeholder:
  the measurement is not implemented yet.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
