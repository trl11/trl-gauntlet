description: >
  The beam-line profile with no end of its own: it samples until the operator
  stops the run from the app, and the verdict is taken over what was
  collected, so a session that measured throughout is recorded as a pass and
  not an abort. For an exposure whose length is decided at the beam rather
  than beforehand.
driver: real
duration_s: 0
sample_period_s: 30.0
max_width: 960

# Pinned, because the camera's own metering compensates for a sensor that is
# dimming and would flatten the drift this run exists to record. Set from a
# bench run against the scene the exposure will actually watch: this is the
# camera's default, and it is a black frame in a room that is not brightly lit.
exposure_us: 5000

baseline_frames: 5
max_luma_drift: 40
max_sharpness_drop: 0.5
max_identical_frames: 3
max_sensor_c: 85

recovery:
  enabled: true
  after_failures: 3
  settle_s: 10
  max_resets: 20

pass_criteria:
  require_measurement: true
