description: >
  Two minutes against the real camera, to prove the bench is wired the way the
  measurement assumes before the beam is on. Run this first: it is the cheapest
  way to catch a missing transport layer, a udev rule that was never installed,
  or a housing that is not mounted to anything and is already at its limit.
driver: real
duration_s: 120.0
sample_period_s: 10.0
max_width: 960

baseline_frames: 3
max_luma_drift: 40
max_sharpness_drop: 0.5
max_identical_frames: 3
max_sensor_c: 85

recovery:
  enabled: true
  after_failures: 3
  settle_s: 10
  max_resets: 2

# Nothing is gated on this run. It is here to be read, not to pass or fail.
pass_criteria:
  require_measurement: true
