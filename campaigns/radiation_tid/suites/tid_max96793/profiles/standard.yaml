description: >
  The beam-line profile for the MAX96793GTJ/VY+: five minutes at 1 Hz, keeping
  one frame every 20s. Narrow `max_errors_per_sample` to the baseline this part
  shows with the beam off.
driver: real
duration_s: 300
sample_period_s: 2
max_width: 960
max_errors_per_sample: 200
max_total_errors: 100000
max_dropped_frames: 8
max_corrupt_frames: 0
max_unlocks: 0
snapshot_period_s: 20
