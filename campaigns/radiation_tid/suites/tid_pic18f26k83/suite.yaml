# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_pic18f26k83
title: PIC18F26K83 Microcontroller
category: radiation
description: >
  Total ionising dose characterisation of the PIC18F26K83-E/SS on TBD. The
  software approach is not yet defined for this component. Placeholder: the
  measurement is not implemented yet.

setup: |
  The bench is not defined yet. Nobody has chosen the test vehicle, and no
  software approach is decided. The host will be a Jetson or a Linux laptop.
  There is nothing wired to describe until then, and the suite runs and
  passes without hardware.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
