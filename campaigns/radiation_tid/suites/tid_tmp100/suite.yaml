# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_tmp100
title: TMP100 Temperature Sensor
category: radiation
description: >
  Total ionising dose characterisation of the TMP100AQDBVRQ1 on PRE-10161.
  Read temperature from the chamber and compare it against a thermocouple.
  Placeholder: the measurement is not implemented yet.

setup: |
  The sensor is on PRE-10161, and a Raspberry Pi reads it over I2C. A
  thermocouple reads the same chamber, and the two readings are compared. That
  is what separates drift in the part from a chamber that really did change
  temperature.

  The board has not arrived, the thermocouple is still to be added to the BOM,
  and the measurement is not implemented. This is the bench the suite is
  written for rather than one that is wired. The suite runs and passes without
  any of it.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
