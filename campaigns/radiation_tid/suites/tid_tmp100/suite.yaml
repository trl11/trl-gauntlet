# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_tmp100
title: TMP100 Temperature Sensor
category: radiation
description: >
  Total ionising dose characterisation of a TMP100 temperature sensor.
  Each sample reads the temperature over I2C, fails it outside the profile's
  bounds, and checks that the configuration and both comparator limits still
  read back as written. The thermocouple comparison is not implemented yet.

setup: |
  The host reads the sensor directly over I2C, through the i2c capability. Its
  address is set by the part's ADD0 and ADD1 pins, 0x48 with both low.

      +--------------+          +--------------+           +----------------+
      |     Host     |   USB    |    CP2112    |    I2C    |     TMP100     |
      |  /dev/i2c-N  |--------->|  USB-to-I2C  |---------->|  12 bit, temp  |
      +--------------+          +--------------+  SDA SCL  +----------------+

  A thermocouple reading the same chamber is what will separate drift in the
  part from a chamber that changed temperature. It is still to be added to the
  BOM, so for now the bounds in the profile are the only check on the reading.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: [i2c]

supports:
  target: false
  unit_serial: true

default_metrics: [tmp100.temperature_c, tmp100.faults]

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    minimum: 0
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.1
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock reads a register model of the part and contacts no instrument.
