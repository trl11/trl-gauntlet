# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_ads7138_tmp112
title: ADS7138 ADC and TMP112 Temperature Sensor
category: radiation
description: >
  Total ionising dose characterisation of the ADS7138 and TMP112 on one DUT
  board, both checked every sample. The ADS7138 holds its analog inputs to a
  window, reads its inputs as wired, drives four outputs the analyzer must see,
  and keeps its registers. The TMP112 reads inside the profile's bounds and
  keeps its registers. A fault in either fails the sample, and each part is
  checked even when the other stops answering.

setup: |
  Both parts are on one board and one I2C bus, reached over a CP2112
  USB-to-I2C bridge through the i2c capability: the ADS7138 at 0x10, the
  TMP112 at 0x49 with ADD0 tied to V+. Four of the ADS7138's outputs run to
  the logic analyzer.

      pin 15  AIN0   analog input      converted, held to a window
      pin 16  AIN1   analog input      converted, held to a window
      pin 1   GPIO2  input, tied to 1  the part must read 1
      pin 4   GPIO5  input, tied to 0  the part must read 0
      pin 2   GPIO3  output, toggled   analyzer probe 2, flips every sample
      pin 3   GPIO4  output, 0         analyzer probe 3
      pin 5   GPIO6  output, 1         analyzer probe 5
      pin 6   GPIO7  output, a pulse   analyzer probe 6, flips every sample

                                              +------ DUT board ------+
      +--------------+   USB   +----------+   |  +-----------------+  |
      |     Host     |-------->|  CP2112  |---+->| ADS7138 at 0x10 |  |
      +--------------+         +----------+ I2C  +-----------------+  |
             ^                                |  | TMP112 at 0x49  |  |
             |                                |  +-----------------+  |
             |                                +-----------|-----------+
             |   USB           +----------+  pins 2,3,5,6 |
             +-----------------| analyzer |<--------------+
                               +----------+

  The probe each output is on, the window each analog input is held to, and
  the temperature bounds are set in the profile.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: [i2c, logic]

supports:
  target: false
  unit_serial: true

default_metrics: [ads7138.ain0_v, ads7138.ain1_v, ads7138.faults, tmp112.faults, tmp112.temperature_c]

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    minimum: 0
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.1
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock drives a register model of each part and contacts no instrument.
