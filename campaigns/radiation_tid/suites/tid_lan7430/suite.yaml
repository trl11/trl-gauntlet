# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_lan7430
title: LAN7430 Ethernet Controller
category: radiation
description: >
  Total ionising dose characterisation of the LAN7430-I/Y9X on EVB-LAN7430.
  Each tick measures throughput across the controller with iperf3, then reads
  everything dose can move: link state and negotiated speed, driver and kernel
  error counters, PCIe link width and AER counters, the OTP image and the
  register dump, temperature, and the bench supply current when there is one.
  The session never aborts, so a part that degrades, dies or recovers is
  recorded rather than lost.

setup: |
  The controller is an EVB-LAN7430 in the M.2 slot of a Raspberry Pi. It
  appears there as an ordinary interface: eth1 on the current bench. The
  controller is the only thing in the beam. The unit that holds it and the lab
  host at the other end of the cable are both outside. Gauntlet reaches the
  unit over SSH with a key. The iperf3 client runs on the lab host.

  The iperf3 server runs on the unit, bound to the controller's own address.
  That is what forces the traffic across the part rather than out of the
  unit's built-in interface. Every tick also compares the interface's own byte
  counters against what iperf3 reported moving, because a run measured on the
  wrong interface still reads as a healthy gigabit.

  The suite reads a bench supply on the rail and never commands it. The supply
  is absent from requires:, so the operator keeps the rail while the beam is
  on. A bench without a supply runs the suite unchanged.

      +----------------+  Ethernet  +--------------+  M.2   +--------------+
      |    Lab host    |----------->| LAN7430 eth1 |------->| Raspberry Pi |
      | iperf3 client  |            |    iperf3    |        |     unit     |
      |                |            |    server    |        |              |
      +----------------+            +--------------+        +--------------+
       outside the beam              under the beam         outside the beam
               |                                                    ^
               +----------------------- SSH ------------------------+

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]

# Charted on the Metrics tab and columned on the Iterations tab before the
# operator picks their own. The two rates and the retransmit count are what
# moves first as a part degrades; UDP loss is what it looks like once the
# link is still up but no longer carrying.
default_metrics: [throughput.retransmits, throughput.rx_mbps, throughput.tx_mbps, udp.loss_pct]

# The bench supply is read, never commanded, and never reserved: the operator
# keeps control of the rail while the beam is on. A bench without one runs
# this suite unchanged.
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
  - name: ssh_user
    flag: --ssh-user
    type: string
    label: SSH user
  - name: ssh_key_path
    flag: --ssh-key-path
    type: string
    label: SSH key
