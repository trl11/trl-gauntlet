description: >
  The beam-line profile for the LAN7430-I/Y9X. One measurement every thirty
  seconds for as long as the exposure lasts, recording throughput and every
  reading that dose is known to move. Nothing is gated tightly: the first
  exposures are for characterisation, and a floor set before the part has been
  measured would only encode a guess. Tighten `pass_criteria` once a baseline
  run exists.
driver: real
duration_s: 28800.0
sample_period_s: 30.0

# The login on the unit. The key is the engineering key carried in the
# extras/trl-engineering-keys submodule, so nothing has to be exported or
# copied into ~/.ssh; set ssh_key_path only on a bench using a different one.
ssh_user: trl

interface:
  name: eth1
  # Left empty so the address is read from the unit at setup. Set it only if
  # the controller carries an address the unit does not report on eth1.
  address: ""
  expected_speed_mbps: 1000

iperf:
  stream_s: 5.0
  omit_s: 1.0
  parallel: 1
  udp_enabled: true
  udp_bitrate: 900M
  udp_stream_s: 3.0

otp:
  enabled: true
  length: 512
  check_registers: true

dmesg:
  enabled: true

psu:
  enabled: true

pass_criteria:
  min_avg_tx_mbps: 1.0
  min_avg_rx_mbps: 1.0
  max_udp_loss_pct: 100.0
  require_measurement: true
  require_otp_stable: false
  require_link_at_end: false
