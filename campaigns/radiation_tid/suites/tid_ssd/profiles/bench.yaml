description: >
  Half a minute on the real drive, for checking the bench before a beam
  session. Run this first: it is the cheapest way to catch a disk the probe
  cannot write to, a cache drop sudo will not allow, or a missing smartctl.
driver: real
duration_s: 30.0
sample_period_s: 15.0

# The login on the unit. The key is the engineering key carried in the
# extras/trl-engineering-keys submodule, so nothing has to be exported or
# copied into ~/.ssh; set ssh_key_path only on a bench using a different one.
ssh_user: trl

probe:
  devices:
    - name: nvme0
      device: /dev/nvme0n1
      test_path: /mnt/ssd-test/gauntlet_ssd_io.bin
  test_size_mb: 128
  verify_size_kb: 128

dmesg:
  enabled: true

psu:
  enabled: true

daq:
  enabled: true

# Nothing is gated on this run. It is here to be read, not to pass or fail.
pass_criteria:
  require_measurement: true
