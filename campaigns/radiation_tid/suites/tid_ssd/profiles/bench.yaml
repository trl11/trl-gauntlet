description: >
  Half a minute against the real drive, to prove the bench is wired the way the
  measurement assumes before the beam is on. Run this first: it is the cheapest
  way to catch a disk the probe cannot write to, a cache drop that sudo will
  not allow — which makes every read rate a fiction — or a smartctl that is not
  installed.
driver: real
duration_s: 30.0
sample_period_s: 15.0

# The login on the unit. The key is the engineering key carried in the
# extras/trl-engineering-keys submodule, so nothing has to be exported or
# copied into ~/.ssh; set ssh_key_path only on a bench using a different one.
ssh_user: trl

probe:
  devices:
    - name: nvme0
      device: /dev/nvme0n1
      test_path: /mnt/ssd-test/gauntlet_ssd_io.bin
  test_size_mb: 128
  verify_size_kb: 128

dmesg:
  enabled: true

psu:
  enabled: true

# Nothing is gated on this run. It is here to be read, not to pass or fail.
pass_criteria:
  require_measurement: true
