# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_ssd
title: NVMe SSD Storage
category: radiation
description: >
  Total ionising dose characterisation of the flight SSD. Each tick measures
  write and read bandwidth with dd, writes a block and compares its SHA-256
  after a cache drop, reads the whole NVMe health log, and collects the kernel
  messages the drive has logged since the last tick. The bench supply current
  is recorded alongside when the bench has a supply. The session never aborts,
  so a drive that slows, corrupts, drains its spare pool, leaves the bus or
  comes back is recorded rather than lost.

setup: |
  The drive is the only thing in the beam. The unit that holds it is outside,
  and Gauntlet reaches that unit over SSH with a key. Nothing about the
  measurement runs on the lab host: `probe.sh` executes on the unit and prints
  one JSON line per device per tick.

  The read rate is only a measurement of the disk if the page cache is dropped
  first, which needs passwordless sudo on the unit. When the drop fails the
  tick still reports a rate, and the suite says in the log that the number came
  from memory rather than from the part. Check that first if the read rate
  looks impossibly good.

  The write-verify is generated on the unit from /dev/urandom and hashed on
  both sides of the disk, so no test pattern crosses SSH and the comparison is
  of what the platter returned against what the controller was given.

  The suite reads a bench supply on the rail and never commands it. The supply
  is absent from requires:, so the operator keeps the rail while the beam is
  on. A bench without a supply runs the suite unchanged.

      +--------------+   SSH    +--------------+  PCIe  +--------------+
      |   Gauntlet   |--------->| Raspberry Pi |------->|  NVMe SSD    |
      |   lab host   |          |     unit     |        |  under test  |
      +--------------+          +--------------+        +--------------+
       outside the beam         outside the beam        under the beam
             |                                                 ^
             |          reads only, never commands             |
             +---------------- bench supply -------------------+

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]

# Charted on the Metrics tab and columned on the Iterations tab before the
# operator picks their own. The two rates sag first as the controller spends
# longer on retries; the media error count is what moves next, and the spare
# pool is what says how much life the part has left.
default_metrics:
  [nvme0.read_mbps, nvme0.smart_available_spare, nvme0.smart_media_errors, nvme0.write_mbps]

# The bench supply is read, never commanded, and never reserved: the operator
# keeps control of the rail while the beam is on. A bench without one runs
# this suite unchanged.
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
  - name: ssh_user
    flag: --ssh-user
    type: string
    label: SSH user
  - name: ssh_key_path
    flag: --ssh-key-path
    type: string
    label: SSH key
