# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: tid_asm330lhb
title: ASM330LHB IMU
category: radiation
description: >
  Total ionising dose characterisation of the ASM330LHBG1TR on STEVAL-
  MKI244A. Execute a continuous capture loop monitoring accelerometer and
  gyroscope outputs. Placeholder: the measurement is not implemented yet.

setup: |
  The IMU is on a STEVAL-MKI244A adapter board. That board mounts on a
  STEVAL-MKI109D motherboard. A Linux laptop reaches the part through the
  motherboard's evaluation MCU, over USB.

  The adapter board has not arrived and the measurement is not implemented, so
  this is the bench the suite is written for rather than one that is wired.
  The suite runs and passes without any of it.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: smoke.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
