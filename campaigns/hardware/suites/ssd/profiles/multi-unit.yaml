description: Four units probed concurrently, eight hours. Every unit must pass.
driver: real
duration_s: 28800.0
sample_period_s: 30.0
units:
  - {name: uut0, host: 192.168.11.10}
  - {name: uut1, host: 192.168.11.11}
  - {name: uut2, host: 192.168.11.12}
  - {name: uut3, host: 192.168.11.13}
probe:
  devices:
    - name: nvme0
      device: /dev/nvme0n1
      test_path: /var/tmp/gauntlet_ssd_io.bin
  test_size_mb: 128
  verify_size_kb: 128
pass_criteria:
  max_anomalies: 100
  max_verify_failures: 0
  require_alive_at_end: true
