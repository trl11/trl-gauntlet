description: Eight-hour session at 30-second ticks with bandwidth floors.
driver: real
duration_s: 28800.0
sample_period_s: 30.0
probe:
  devices:
    - name: nvme0
      device: /dev/nvme0n1
      test_path: /var/tmp/gauntlet_ssd_io.bin
  test_size_mb: 256
  verify_size_kb: 256
  read_floor_mbps: 500.0
  write_floor_mbps: 300.0
monitor:
  enabled: true
  sample_period_s: 30.0
pass_criteria:
  max_anomalies: 100
  max_verify_failures: 0
  require_alive_at_end: true
