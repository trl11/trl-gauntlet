description: >
  For a unit with an unmounted disk. Formats and mounts it first, then installs
  the probe. Formatting destroys the contents of `provision.device`.
driver: real
duration_s: 3600.0
sample_period_s: 15.0
probe:
  devices:
    - name: ssd0
      device: /dev/nvme0n1
      test_path: /mnt/ssd-test/gauntlet_ssd_io.bin
  test_size_mb: 128
  verify_size_kb: 128
provision:
  enabled: true
  device: /dev/nvme0n1
  mount_point: /mnt/ssd-test
  filesystem: ext4
  format_device: true
