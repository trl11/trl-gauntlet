description: >
  A continuous session at thirty-second ticks with bandwidth floors. The run
  has no end of its own: it samples until the operator stops it from the
  app, and the verdict is taken over what was collected, so a session whose
  every iteration passed is recorded as a pass and not an abort.
driver: real
duration_s: 0
sample_period_s: 30.0
probe:
  devices:
    - name: nvme0
      device: /dev/nvme0n1
      test_path: /var/tmp/gauntlet_ssd_io.bin
  test_size_mb: 256
  verify_size_kb: 256
  read_floor_mbps: 500.0
  write_floor_mbps: 300.0
monitor:
  enabled: true
  sample_period_s: 30.0
pass_criteria:
  max_anomalies: 100
  max_verify_failures: 0
  require_alive_at_end: true
