# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: gmsl_camera
title: GMSL Camera
category: hardware
description: >
  Take a still from the camera on a fixed period and keep every one as an
  artifact. Each snapshot is measured for brightness and edge detail and
  compared with the one before it, so a camera that has gone dark, gone soft or
  stopped producing new pictures fails the run rather than filling the frames
  directory with identical images.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, frames, junit, manifest, metrics, summary, verdict]
requires: [camera]

supports:
  target: false
  unit_serial: true

default_metrics: [camera.mean_luma, camera.sharpness]

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    # Zero is a duration: it gives the loop no end of its own and the suite
    # samples until the operator stops the run, which is what `continuous.yaml`
    # ships. A floor of 1 would reject the value that profile seeds the form
    # with.
    minimum: 0
    help: How long to keep taking snapshots.
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.5
    help: >
      Seconds between snapshots. Converting a 4K frame to a 960px snapshot
      costs about half a second and rises with the width, so a real run is
      refused below 1s rather than quietly delivering a slower rate than it
      asked for. A mock run synthesises a small frame and may go quicker.
  - name: max_width
    flag: --max-width
    type: integer
    label: Snapshot width
    unit: px
    minimum: 16
    maximum: 3840
    help: >
      Width to scale each snapshot to. The camera's own width is used when
      this is larger than it; the height follows the aspect ratio.
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock synthesises frames and contacts no instrument.
