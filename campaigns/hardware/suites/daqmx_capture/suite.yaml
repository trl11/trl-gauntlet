# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: daqmx_capture
title: DAQmx Capture
category: hardware
description: >
  Record the analog inputs of an NI-DAQmx module for a fixed duration. Channels
  are named as NI names them — `ai0`, `ai1` — and each takes a label and, where
  the module offers a choice, a voltage range. Every acquisition is written to
  metrics under that label. A reading is the mean of a short acquisition, not
  one conversion: a delta-sigma converter samples only against a clock, which
  is why this measures DC and reports no RMS.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: [daq]

supports:
  target: false
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    # Zero is a duration: it gives the loop no end of its own and the suite
    # samples until the operator stops the run, which is what `continuous.yaml`
    # ships. A floor of 1 would reject the value that profile seeds the form
    # with.
    minimum: 0
    help: How long to keep capturing.
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.25
    help: >
      Seconds between acquisitions. Each one is a metrics record. An
      acquisition is a hundred samples at the module's own rate, so a shorter
      period is refused rather than quietly delivering a slower rate than it
      asked for.
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock synthesises readings and contacts no instrument.
