# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: daqmx_capture
title: DAQmx Capture
category: hardware
description: >
  Record the analog inputs of an NI-DAQmx module for a fixed duration. Every
  channel the module has is written to metrics, under the label its input was
  given. A channel the profile lists is also judged: it must read, read inside
  the `min_v` to `max_v` window given for it, and move at all — a floating
  input pins at the rail and sits there. A reading is the mean of a short
  acquisition, not one conversion, so this measures DC and reports no RMS.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: [daq]

supports:
  target: false
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    # Zero is a duration: it gives the loop no end of its own and the suite
    # samples until the operator stops the run, which is what `continuous.yaml`
    # ships. A floor of 1 would reject the value that profile seeds the form
    # with.
    minimum: 0
    help: How long to keep capturing.
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.25
    help: >
      Seconds between acquisitions. Each acquisition is one metrics record
      of a hundred samples at the module's own rate, so the suite refuses a
      shorter period instead of running slower than asked.
  - name: capture_rate_hz
    flag: --capture-rate-hz
    type: number
    label: Capture rate
    unit: S/s
    minimum: 0
    help: >
      Record the waveform at this many samples a second, instead of the mean
      of a short acquisition. An NI-9238 runs its converters between 1613
      and 50000 S/s. Each acquisition writes one CSV file to `captures/`.
      Zero records the mean only.
  - name: capture_samples
    flag: --capture-samples
    type: integer
    label: Capture samples
    minimum: 2
    maximum: 25000
    help: >
      Samples per channel in each capture. 5000 at 25000 S/s is a fifth of a
      second of signal.
  - name: labels
    flag: --labels
    type: string
    label: Channel labels
    help: >
      Name the inputs for this run, as `ai0=Rail 3V3, ai2=Ground`. The name
      appears on the module and on every metric the channel records. Naming
      a channel the profile omits adds it. Leave this empty to keep the
      profile's own labels.
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock synthesises readings and contacts no instrument.
