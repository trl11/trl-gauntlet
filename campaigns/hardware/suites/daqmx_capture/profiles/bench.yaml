description: >
  Half a minute of every analog input on the module, on whatever range each is
  already set to. The starting point for a bench: name the inputs for what is
  wired to them, and give each a `min_v` and `max_v` window once you know what
  it should read — without one a channel is recorded and only judged on having
  answered at all. Set a range on any input the module offers a choice for; an
  NI-9238 has one and needs none, which is what leaving `mode` empty is for.
driver: real
duration_s: 30
sample_period_s: 1
channels:
  - channel: ai0
    label: AI 0
  - channel: ai1
    label: AI 1
  - channel: ai2
    label: AI 2
  - channel: ai3
    label: AI 3
