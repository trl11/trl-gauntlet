description: >
  Every analog input on the module, sampled continuously. Name the inputs for
  what is wired to them and set a range on any the module offers a choice for.
  The run has no end of its own: it samples until the operator stops it from
  the app, and the verdict is taken over what was collected, so a session whose
  every iteration passed is recorded as a pass and not an abort.
driver: real
duration_s: 0
sample_period_s: 1
channels:
  - channel: ai0
    label: AI 0
  - channel: ai1
    label: AI 1
  - channel: ai2
    label: AI 2
  - channel: ai3
    label: AI 3
