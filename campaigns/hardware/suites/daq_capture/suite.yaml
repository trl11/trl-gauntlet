# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: daq_capture
title: DAQ Capture
category: hardware
description: >
  Record the analog inputs of the acquisition unit for a fixed duration. Each
  channel is given a range or a thermocouple type and a label, and every scan
  is written to metrics under that label, so the readings chart and export
  under the name of whatever is wired to the channel.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: [daq]

supports:
  target: false
  unit_serial: true

overrides:
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    # Zero is a duration: it gives the loop no end of its own and the suite
    # samples until the operator stops the run, which is what `continuous.yaml`
    # ships. A floor of 1 would reject the value that profile seeds the form
    # with.
    minimum: 0
    help: How long to keep capturing.
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.25
    help: >
      Seconds between scans. Each scan is one metrics record. One scan of the
      unit costs about 0.18s, so a shorter period is refused rather than
      quietly delivering a slower rate than it asked for.
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock synthesises readings and contacts no instrument.
