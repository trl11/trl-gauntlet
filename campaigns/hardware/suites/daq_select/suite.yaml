# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: daq_select
title: DAQ Select
category: hardware
description: >
  Record the analog inputs of the acquisition units you select, all at once.
  A bench with two DAQs registers them as `daq.0` and `daq.1` (or under the
  roles `config.yaml` binds), and this suite measures whichever the run names,
  or every DAQ on the bench when it names none. Each unit's readings are
  recorded under its own instance id, so `daq0.rail_3v3` and `daq1.rail_3v3`
  chart and export as separate series.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]

# The selection is made per run, and a manifest cannot say which instruments a
# run will pick, so nothing is reserved: a DAQ named here is looked up when the
# run starts and the run fails if it is not there.
requires: []

supports:
  target: false
  unit_serial: true

overrides:
  - name: daqs
    flag: --daqs
    type: string
    label: DAQs
    help: >
      Instruments to measure, comma separated: `daq.0,daq.1`, or `daq` for a
      bench with one. Empty measures every DAQ on the bench. The Instruments
      page lists the names.
  - name: duration_s
    flag: --duration-s
    type: number
    label: Duration
    unit: s
    minimum: 0
    help: How long to keep capturing. Zero runs until the operator stops the run.
  - name: sample_period_s
    flag: --sample-period-s
    type: number
    label: Sample period
    unit: s
    minimum: 0.25
    help: >
      Seconds between scans. Each scan costs about 0.18s per unit and units are
      scanned one after another, so many units at a short period run late.
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
    help: mock synthesises readings and contacts no instrument.
