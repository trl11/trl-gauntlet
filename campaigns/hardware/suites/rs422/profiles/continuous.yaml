description: >
  A link session with a small loss budget. Runs until the operator stops it.
driver: real
duration_s: 0
sample_period_s: 5.0
rate_hz: 100.0
link:
  device: auto
  baud: 115200
pass_criteria:
  max_missing: 50
  max_anomalies: 100
  # A total that assumes a long session would fail one the operator stopped
  # early, so what is gated here is the loss rate rather than the count.
  min_received: 0
  require_alive_at_end: true
