description: >
  Five stills from the real camera, scaled to 960px wide. The thresholds pass
  any lit scene, so a failure here is the camera or the bench.
driver: real
frames: 5
sample_period_s: 1.5
max_width: 960
# Zero leaves the camera metering for itself, which is what a check of whether
# the camera works wants: it copes with whatever the room is.
exposure_us: 0
min_mean_luma: 4
max_mean_luma: 250
min_sharpness: 0.5
max_identical_frames: 1
max_sensor_c: 85
