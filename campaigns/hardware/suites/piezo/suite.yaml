# yaml-language-server: $schema=http://127.0.0.1:7100/api/schemas/suite
apiVersion: 1
key: piezo
title: Piezo Motion
category: hardware
description: >
  Cycle one or more piezo axes between a home and an extended position over
  MQTT, recording position, temperature and controller fault flags at the
  loaded endpoint.

exec:
  command: ["python", "-m", "suite.cli"]
  args:
    profile: --profile
    run_dir: --run-dir
    target: --target
    unit_serial: --unit-serial
  profile_schema_command: ["python", "-m", "suite.cli", "--print-profile-schema"]

profiles: ./profiles
conformance_profile: mock.yaml

produces: [events, junit, manifest, metrics, summary, verdict]
requires: []

supports:
  target: true
  unit_serial: true

overrides:
  - name: cycles
    flag: --cycles
    type: integer
    label: Cycles
  - name: cycle_delay_s
    flag: --cycle-delay-s
    type: number
    label: Delay between cycles
    unit: s
  - name: driver
    flag: --driver
    type: string
    label: Driver
    choices: [real, mock]
