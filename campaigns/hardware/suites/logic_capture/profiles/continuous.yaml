description: >
  All eight probes at full rate, captured continuously. Name the probes for
  what they are clipped to, and say what each one is expected to be doing,
  since a probe left as `any` is recorded but never fails a run. The run has
  no end of its own: it samples until the operator stops it from the app,
  and the verdict is taken over what was collected, so a session whose every
  iteration passed is recorded as a pass and not an abort.
driver: real
duration_s: 0
sample_period_s: 1
rate: 24mhz
window: 10ms
save_traces: true
channels:
  - channel: "1"
    label: CH 1
  - channel: "2"
    label: CH 2
  - channel: "3"
    label: CH 3
  - channel: "4"
    label: CH 4
  - channel: "5"
    label: CH 5
  - channel: "6"
    label: CH 6
  - channel: "7"
    label: CH 7
  - channel: "8"
    label: CH 8
