description: >
  Half a minute of all eight probes at full rate. Name the probes and say what
  each should be doing; a probe left as `any` never fails a run.
driver: real
duration_s: 30
sample_period_s: 1
rate: 24mhz
window: 10ms
save_traces: true
channels:
  - channel: "1"
    label: CH 1
  - channel: "2"
    label: CH 2
  - channel: "3"
    label: CH 3
  - channel: "4"
    label: CH 4
  - channel: "5"
    label: CH 5
  - channel: "6"
    label: CH 6
  - channel: "7"
    label: CH 7
  - channel: "8"
    label: CH 8
