description: >
  Pulses with a one-second gap, emitted continuously. The run has no end of
  its own: it samples until the operator stops it from the app, and the
  verdict is taken over what was collected, so a session whose every
  iteration passed is recorded as a pass and not an abort.
driver: real
runs: 0
cycle_delay_s: 1.0
trigger:
  chip: gpiochip0
  line: 43
  high_seconds: 1.0
  low_seconds: 1.0
  command_timeout_s: 30.0
monitor:
  enabled: true
  sample_period_s: 10.0
pass_criteria:
  max_failures: 5
  max_anomalies: 50
  require_alive_at_end: true
