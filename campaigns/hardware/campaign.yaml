# yaml-language-server: $schema=http://127.0.0.1:7100/api/campaigns/schema
apiVersion: 1
key: hardware
title: Hardware Bench
description: >
  The suites that drive real hardware. Most reach it over a transport they
  declare as an extra of gauntlet-sdk; daq_capture and gmsl_camera are driven
  through an instrument Gauntlet lends them instead. Each ships a mock profile
  that runs without any of it. Membership is ./suites: a suite added there joins
  this campaign on the next rescan, with or without an entry below.

suites: ./suites

members:
  - suite: ssd
    profile: smoke.yaml
    notes: Half a minute of write, read, SHA-256 verify and SMART counters over SSH —
      the quick answer to whether a disk works. The radiation campaign's tid_ssd runs
      the same probe for hours, against a part being characterised.
  - suite: ethernet
    profile: smoke.yaml
    notes: Timed upload and download between the unit and the lab host, over SSH and TCP.
  - suite: hardware_trigger
    profile: smoke.yaml
    notes: GPIO trigger pulse train, over SSH.
  - suite: can_bus
    profile: smoke.yaml
    notes: Counter frames from the unit, over SSH and socketcan.
  - suite: rs422
    profile: smoke.yaml
    notes: Counter replies over an RS422 serial link.
  - suite: piezo
    profile: smoke.yaml
    notes: Extend-and-return motion cycles, over MQTT.
  - suite: gmsl_camera
    profile: bench.yaml
    notes: Stills from the bench camera on a fixed period, over UVC. The bench one
      is a GMSL sensor behind a GMSL-to-USB adapter, which arrives as an ordinary
      capture device.
