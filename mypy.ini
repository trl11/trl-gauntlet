; Type-checking configuration for both packages.
;
; This file exists so a checkout nested inside another repository does not
; inherit that repository's mypy settings.

[mypy]
python_version = 3.10
strict = True
warn_return_any = False
warn_unused_ignores = False
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
mypy_path = packages/gauntlet/src:packages/gauntlet-suite/src
; Template files hold __SUITE_* placeholders and are rendered, not run.
exclude = (?x)(packages/gauntlet/src/gauntlet/scaffold/templates/)
